[package]
name = "limit-tldr"
version = "0.0.32"
edition = "2021"
description = "Code analysis library that actually fits in context - 95% token savings"
license = "Apache-2.0"
repository = "https://github.com/marioidival/limit"
keywords = ["code-analysis", "ast", "call-graph", "cfg", "semantic-search"]
categories = ["development-tools"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Hashing for incremental updates
blake3 = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Parallel processing
rayon = "1.10"

# Path handling
walkdir = "2.5"
ignore = "0.4"

# Regex for parsing (fallback)
regex = "1.10"

# Tree-sitter for robust parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# Optional tree-sitter parsers
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }

# Semantic embeddings
fastembed = { version = "5", optional = true }
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }

[features]
default = ["semantic"]
semantic = ["fastembed", "openssl-sys"]
tree-sitter-extra = ["tree-sitter-ruby", "tree-sitter-php", "tree-sitter-c-sharp"]

[dev-dependencies]
tempfile = "3.10"
