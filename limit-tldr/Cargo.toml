[package]
name = "limit-tldr"
version = "0.1.0"
edition = "2021"
description = "Code analysis library that actually fits in context - 95% token savings"
license = "Apache-2.0"
repository = "https://github.com/marioidival/limit"
keywords = ["code-analysis", "ast", "call-graph", "cfg", "semantic-search"]
categories = ["development-tools"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Hashing for incremental updates
blake3 = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Parallel processing
rayon = "1.10"

# Path handling
walkdir = "2.5"

# Regex for parsing
regex = "1.10"

[features]
default = []
daemon = []
semantic = []

[dev-dependencies]
tempfile = "3.10"
