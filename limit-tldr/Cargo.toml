[package]
name = "limit-tldr"
version = "0.1.0"
edition = "2021"
description = "Code analysis that actually fits in context - 95% token savings"
license = "Apache-2.0"
repository = "https://github.com/marioidival/limit"
keywords = ["code-analysis", "ast", "call-graph", "cfg", "semantic-search"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Hashing for incremental updates
blake3 = "1.5"

# Semantic search (optional)
candle-core = { version = "0.4", optional = true }
candle-nn = { version = "0.4", optional = true }
candle-transformers = { version = "0.4", optional = true }
tokenizers = { version = "0.15", optional = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallel processing
rayon = "1.10"

# Regex for simple parsing
regex = "1.10"

# Path handling
glob = "0.3"
walkdir = "2.5"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["daemon"]
daemon = []
semantic = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]
full = ["daemon", "semantic"]

[[bin]]
name = "tldr"
path = "src/bin/tldr.rs"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
