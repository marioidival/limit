[package]
name = "limit-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
limit-agent = { path = "../limit-agent" }
rustyline = "14.0"
crossterm = "0.29"
similar = "2.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tempfile = "3.8"
termimad = "0.34"
