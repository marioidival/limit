[package]
name = "limit-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "limit_cli"
path = "src/lib.rs"

[[bin]]
name = "limit"
path = "src/main.rs"

[dependencies]
thiserror = "1.0"
futures = "0.3"
limit-agent = { path = "../limit-agent" }
rustyline = "14.0"
crossterm = "0.29"
ratatui = "0.29"
similar = "2.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tempfile = "3.8"
termimad = "0.34"
regex = "1.10"
lsp-types = "0.95"
bincode = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = "0.31"
limit-llm = { path = "../limit-llm" }
limit-tui = { path = "../limit-tui" }
