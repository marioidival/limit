[package]
name = "limit-cli"
version = "0.0.44"
edition = "2021"
description = "AI-powered terminal coding assistant with TUI. Multi-provider LLM support, session persistence, and built-in tools."
authors = ["Mário Idival <marioidival@gmail.com>"]
license = "MIT"
repository = "https://github.com/marioidival/limit"
keywords = ["cli", "ai", "assistant", "coding", "terminal"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "limit_cli"
path = "src/lib.rs"

[[bin]]
name = "lim"
path = "src/main.rs"

[dependencies]
thiserror = "2"
futures = "0.3"
limit-agent = { path = "../limit-agent", version = "0.0.44" }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
ratatui = "0.29"
similar = "2.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tempfile = "3.8"
syntect = { version = "5.2", default-features = false, features = [
    "default-onig",
    "parsing",
    "dump-load",
] }
lsp-types = "0.95"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
limit-llm = { path = "../limit-llm", version = "0.0.44" }
limit-tui = { path = "../limit-tui", version = "0.0.44" }
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_warn"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
arboard = "3.6"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
shlex = "1.3"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
frizbee = "0.8"
ignore = "0.4"
regex = "1.10"
ast-grep-core = "0.42"
ast-grep-language = { version = "0.42", features = ["builtin-parser"] }

walkdir = "2.5"
rand = "0.10"
