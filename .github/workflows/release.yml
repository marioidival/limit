name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: limit-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: limit-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: limit-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: limit-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv limit ${{ matrix.name }}
          tar czf ${{ github.workspace }}/${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ github.workspace }}/${{ matrix.name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
