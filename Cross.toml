[build.env]
passthrough = [
    "RUST_BACKTRACE",
]

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config",
]
