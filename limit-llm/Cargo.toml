[package]
name = "limit-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
dirs = "5.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
futures = "0.3"
async-trait = "0.1"
bytes = "1.0"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"


