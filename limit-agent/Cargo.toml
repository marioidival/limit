[package]
name = "limit-agent"
version = "0.0.10"
edition = "2021"

[dependencies]
bincode = "1.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
limit-llm = { path = "../limit-llm" }
bollard = "0.16"
uuid = { version = "1.0", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
