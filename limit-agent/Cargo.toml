[package]
name = "limit-agent"
version = "0.0.43"
edition = "2021"
description = "Agent runtime for AI applications with tool registry, parallel execution, and Docker sandbox support."
authors = ["Mário Idival <marioidival@gmail.com>"]
license = "MIT"
repository = "https://github.com/marioidival/limit"
keywords = ["ai", "agent", "automation", "docker", "sandbox"]
categories = ["development-tools", "asynchronous"]
readme = "README.md"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
limit-llm = { path = "../limit-llm", version = "0.0.43" }
bollard = "0.16"
uuid = { version = "1.0", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
dirs = "5.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
